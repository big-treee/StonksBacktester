[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-quant-research-engine"
version = "0.1.0"
description = "Event-driven backtesting and research engine for NSE equities"
authors = [{ name = "Krishna Beniwal" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy<2.0.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "yfinance>=0.2.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "questionary>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.0.290",
    "mypy>=1.5.0",
]

[project.scripts]
nse-quant = "nse_quant_engine.cli:cli"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
namespace_packages = true
mypy_path = "."
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
disallow_untyped_calls = false
disable_error_code = ["import-untyped"]
